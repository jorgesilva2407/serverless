apiVersion: apps/v1
kind: Deployment
metadata:
  name: serverless-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: serverless-redis
  template:
    metadata:
      labels:
        app: serverless-redis
    spec:
      containers:
        - name: serverless-redis
          image: igorjsc/runtime:v1
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 100m
              memory: 300Mi
          env:
            - name: REDIS_HOST
              value: "192.168.121.187"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_INPUT_KEY
              value: "metrics"
            - name: REDIS_OUTPUT_KEY
              valueFrom:
                configMapKeyRef:
                  name: outputkey
                  key: REDIS_OUTPUT_KEY

            - name: POLL_INTERVAL
              value: "6"

            - name: ZIP_FILE
              value: "https://github.com/jorgesilva2407/serverless/raw/refs/heads/main/runtime/example_handler.zip"

            - name: FUNCTION_HANDLER
              value: "handler"

      volumes:
        - name: pyfile
          configMap:
            name: pyfile
